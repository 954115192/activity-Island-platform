<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>清空通知</title>
  <style>
    :root {
      --bg: #0d0f14;
      --panel: #161a22;
      --panel-hover: #1d222c;
      --ink: #f4f4f5;
      --dim: #a1a1aa;
      --faint: #6b7280;
      --stroke: rgba(255, 255, 255, 0.09);
      --accent: #3b82f6;
      --warn: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; background: transparent; overflow: hidden;
      font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      color: var(--ink);
    }
    .frame {
      height: 100%;
      display: flex; flex-direction: column;
      background: var(--bg);
      border: 1px solid var(--stroke);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 18px 48px rgba(0, 0, 0, .55);
    }
    header {
      display: flex; align-items: center; gap: 9px;
      padding: 14px 14px 10px 16px;
      -webkit-app-region: drag;
    }
    header .mark {
      flex: none; width: 22px; height: 22px; border-radius: 7px;
      display: grid; place-items: center;
      background: rgba(245, 158, 11, .14); color: var(--warn);
    }
    header .mark svg { width: 13px; height: 13px; }
    header h1 { margin: 0; font-size: 13px; font-weight: 650; letter-spacing: -0.01em; }
    header .spacer { flex: 1; }
    header button.close {
      -webkit-app-region: no-drag;
      width: 24px; height: 24px; border: 0; border-radius: 7px;
      background: transparent; color: var(--faint); cursor: pointer;
      display: grid; place-items: center;
    }
    header button.close:hover { background: rgba(255,255,255,.07); color: var(--ink); }
    header button.close svg { width: 12px; height: 12px; }

    .body { padding: 2px 16px 0; }
    .body p {
      margin: 0; font-size: 12px; line-height: 1.7; color: var(--dim);
    }
    .body p + p { margin-top: 5px; }
    .body .note { color: var(--faint); font-size: 11.5px; }

    .choices {
      padding: 14px 12px 12px;
      display: flex; flex-direction: column; gap: 6px;
    }
    button.choice {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 10px 12px;
      border: 1px solid var(--stroke); border-radius: 10px;
      background: var(--panel); color: var(--ink);
      font-size: 12.5px; font-family: inherit; text-align: left;
      cursor: pointer; transition: background .12s, border-color .12s;
    }
    button.choice:hover { background: var(--panel-hover); border-color: rgba(255,255,255,.16); }
    button.choice:focus-visible { outline: none; border-color: rgba(59,130,246,.7); }
    button.choice .ico {
      flex: none; width: 26px; height: 26px; border-radius: 8px;
      display: grid; place-items: center;
      background: rgba(255,255,255,.06); color: var(--dim);
    }
    button.choice .ico svg { width: 13px; height: 13px; }
    button.choice .text { flex: 1; min-width: 0; }
    button.choice .label { display: block; font-weight: 600; letter-spacing: -0.01em; }
    button.choice .sub { display: block; margin-top: 2px; font-size: 11px; color: var(--faint); }
    button.choice.primary .ico { background: rgba(59,130,246,.16); color: #60a5fa; }
    button.choice.danger:hover { border-color: rgba(239,68,68,.45); }
    button.choice.danger .ico { background: rgba(239,68,68,.14); color: #f87171; }
    button.choice:disabled { opacity: .45; cursor: not-allowed; }
    button.choice:disabled:hover { background: var(--panel); border-color: var(--stroke); }

    .foot { padding: 0 12px 12px; }
    button.ghost {
      width: 100%; padding: 9px 12px;
      border: 0; border-radius: 10px; background: transparent;
      color: var(--faint); font-size: 12px; font-family: inherit; cursor: pointer;
    }
    button.ghost:hover { background: rgba(255,255,255,.05); color: var(--dim); }
  </style>
</head>
<body>
  <div class="frame">
    <header>
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>
          <path d="M12 9v4"/><path d="M12 17h.01"/>
        </svg>
      </span>
      <h1>清空通知记录</h1>
      <span class="spacer"></span>
      <button class="close" data-action="cancel" title="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </header>

    <div class="body">
      <p>应用内历史与 Windows 通知中心是两份独立的数据。</p>
      <p class="note" id="note"></p>
    </div>

    <div class="choices">
      <button class="choice primary" data-action="app-only">
        <span class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h16"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
            <path d="M6.5 7l.8 12.1A2 2 0 0 0 9.3 21h5.4a2 2 0 0 0 2-1.9L17.5 7"/>
          </svg>
        </span>
        <span class="text">
          <span class="label">清空应用内历史</span>
          <span class="sub">不动系统通知中心</span>
        </span>
      </button>

      <button class="choice danger" data-action="both" id="both">
        <span class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"/><path d="M8 6V4h8v2"/>
            <path d="M5 6l1 14h12l1-14"/><path d="M10 11v5M14 11v5"/>
          </svg>
        </span>
        <span class="text">
          <span class="label">同时清空 Windows 通知中心</span>
          <span class="sub" id="both-sub">系统通知中心只能整体清空，无法按单条删除</span>
        </span>
      </button>
    </div>

    <div class="foot">
      <button class="ghost" data-action="cancel">取消</button>
    </div>
  </div>
  <script src="confirm.js"></script>
</body>
</html>
