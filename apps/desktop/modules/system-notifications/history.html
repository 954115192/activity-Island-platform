<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>通知历史</title>
  <style>
    :root {
      --bg: #0b0d12;
      --panel: #14171f;
      --ink: #f4f4f5;
      --dim: #a1a1aa;
      --faint: #71717a;
      --stroke: rgba(255, 255, 255, 0.08);
      --accent: #3b82f6;
      --warn: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
      font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
    header { display: flex; align-items: center; gap: 10px; padding: 16px 20px 12px; }
    header h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
    header .count { font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
    header .spacer { flex: 1; }
    input[type="search"] {
      width: 220px; padding: 7px 11px; border-radius: 9px; border: 1px solid var(--stroke);
      background: var(--panel); color: var(--ink); font-size: 12px; outline: none;
    }
    input[type="search"]:focus { border-color: rgba(59, 130, 246, 0.6); }
    button {
      padding: 7px 11px; border-radius: 9px; border: 1px solid var(--stroke);
      background: var(--panel); color: var(--dim); font-size: 12px; cursor: pointer;
    }
    button:hover { color: var(--ink); border-color: rgba(255,255,255,.18); }
    button.danger:hover { color: #fca5a5; border-color: rgba(239,68,68,.45); }
    .filters { display: flex; gap: 6px; padding: 0 20px 12px; flex-wrap: wrap; }
    .filters button.active { color: var(--ink); border-color: rgba(59,130,246,.55); background: rgba(59,130,246,.12); }
    .meta { padding: 0 20px 12px; font-size: 11.5px; color: var(--faint); line-height: 1.7; }
    .meta code { color: var(--dim); background: rgba(255,255,255,.05); padding: 2px 6px; border-radius: 5px; }
    main { height: calc(100% - 150px); overflow: auto; padding: 0 20px 20px; }
    .row {
      display: flex; gap: 12px; padding: 12px 14px; border-radius: 12px;
      border: 1px solid var(--stroke); background: var(--panel); margin-bottom: 8px;
    }
    .row.is-dismissed { opacity: .5; }
    .badge { flex: none; width: 28px; height: 28px; border-radius: 9px; display: grid;
      place-items: center; font-size: 12px; font-weight: 650; background: rgba(255,255,255,.07); }
    .badge.warn { background: rgba(245,158,11,.2); color: #fbbf24; }
    .badge.critical { background: rgba(239,68,68,.2); color: #f87171; }
    .body { flex: 1; min-width: 0; }
    .top { display: flex; align-items: baseline; gap: 8px; }
    .title { font-size: 13px; font-weight: 600; letter-spacing: -0.01em;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .time { margin-left: auto; font-size: 11px; color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .sub { margin-top: 3px; font-size: 12px; color: var(--dim); line-height: 1.55; }
    .tags { margin-top: 6px; display: flex; gap: 6px; align-items: center; font-size: 10.5px; color: var(--faint); }
    .tag { padding: 2px 7px; border-radius: 999px; background: rgba(255,255,255,.06); }
    .empty { padding: 60px 0; text-align: center; color: var(--faint); font-size: 12.5px; line-height: 1.8; }
  </style>
</head>
<body>
  <header>
    <h1>通知历史</h1>
    <span class="count" id="count">0 条</span>
    <span class="spacer"></span>
    <input id="search" type="search" placeholder="搜索标题、正文或应用" />
    <button id="clear" class="danger">清空</button>
  </header>
  <div class="filters" id="filters">
    <button data-filter="all" class="active">全部</button>
    <button data-filter="windows">Windows 通知</button>
    <button data-filter="local-trigger">本地接口</button>
    <button data-filter="warn">警告</button>
    <button data-filter="critical">严重</button>
  </div>
  <div class="meta" id="meta"></div>
  <main id="list"></main>
  <script src="history.js"></script>
</body>
</html>
